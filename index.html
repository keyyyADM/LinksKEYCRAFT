<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Keycraft • Modpack & Links</title>
  <style>
    :root {
      --bg: #030703;
      --card: #0a120a;
      --card-hover: #101c10;
      --border: #162e16;
      --text: #f3f4f6;
      --muted: #9ca3af;
      
      /* Cores Verdes Keycraft Dinâmicas e Vibrantes */
      --green: #00ff66;
      --green-light: #33ff88;
      --green-dark: #008833;
      --green-glow: rgba(0, 255, 102, 0.35);
      --green-glow-strong: rgba(0, 255, 102, 0.6);
    }

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: var(--bg);
      background-image: 
        radial-gradient(circle at 50% -20%, rgba(0, 255, 102, 0.2) 0%, transparent 60%),
        radial-gradient(circle at 80% 90%, rgba(0, 136, 51, 0.1) 0%, transparent 50%);
      color: var(--text);
      display: flex;
      justify-content: center;
      padding: 36px 16px 48px;
      min-height: 100vh;
    }

    .container {
      width: 100%;
      max-width: 520px;
    }

    header {
      text-align: center;
      margin-bottom: 28px;
    }

    .avatar-container {
      width: 96px;
      height: 96px;
      margin: 0 auto 14px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--green), var(--green-dark));
      padding: 3px;
      box-shadow: 0 0 32px var(--green-glow);
      animation: pulseGlow 3s infinite alternate;
    }

    @keyframes pulseGlow {
      0% { box-shadow: 0 0 20px rgba(0, 255, 102, 0.2); }
      100% { box-shadow: 0 0 38px var(--green-glow-strong); }
    }

    .avatar {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      object-fit: cover;
      background-color: #0d140d;
    }

    header h1 {
      font-size: 1.8rem;
      font-weight: 800;
      margin-bottom: 4px;
      letter-spacing: -0.02em;
      background: linear-gradient(90deg, #fff, var(--green-light));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    header .handle {
      color: var(--green);
      font-size: 0.88rem;
      font-weight: 700;
      text-shadow: 0 0 10px rgba(0, 255, 102, 0.4);
    }

    .actions {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-top: 20px;
      margin-bottom: 24px;
    }

    .btn-primary {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      text-decoration: none;
      padding: 15px 18px;
      border-radius: 12px;
      font-weight: 700;
      font-size: 0.96rem;
      transition: transform 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275), box-shadow 0.25s ease, background-color 0.2s ease;
    }

    .btn-primary:hover {
      transform: scale(1.03) translateY(-2px);
    }

    .btn-pix {
      background: linear-gradient(135deg, var(--green), var(--green-dark));
      color: #030a03;
      box-shadow: 0 4px 24px var(--green-glow);
      font-weight: 800;
    }

    .btn-pix:hover {
      background: linear-gradient(135deg, var(--green-light), var(--green));
      box-shadow: 0 6px 30px var(--green-glow-strong);
    }

    .btn-video {
      background-color: var(--card);
      color: var(--text);
      border: 1px solid var(--border);
    }

    .btn-video:hover {
      border-color: var(--green);
      background-color: var(--card-hover);
      box-shadow: 0 6px 25px rgba(0, 255, 102, 0.25);
      color: var(--green-light);
    }

    .search-filter-wrapper {
      margin-bottom: 16px;
    }

    .search-box {
      position: relative;
      margin-bottom: 12px;
    }

    .search-box input {
      width: 100%;
      padding: 14px 18px;
      border-radius: 12px;
      border: 1px solid var(--border);
      background-color: var(--card);
      color: var(--text);
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    .search-box input:focus {
      border-color: var(--green);
      box-shadow: 0 0 0 3px rgba(0, 255, 102, 0.25);
    }

    /* Filtros rápidos */
    .filter-pills {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 4px;
      scrollbar-width: none;
    }

    .filter-pills::-webkit-scrollbar {
      display: none;
    }

    .pill {
      background-color: var(--card);
      border: 1px solid var(--border);
      color: var(--muted);
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.2s ease;
    }

    .pill:hover, .pill.active {
      background-color: rgba(0, 255, 102, 0.15);
      border-color: var(--green);
      color: var(--green);
      box-shadow: 0 0 10px rgba(0, 255, 102, 0.2);
      transform: scale(1.05);
    }

    .section-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }

    .section-title {
      font-size: 0.78rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--muted);
      font-weight: 600;
    }

    .mod-count {
      font-size: 0.75rem;
      color: var(--muted);
    }

    .mod-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .mod-card {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background-color: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 15px 18px;
      text-decoration: none;
      color: var(--text);
      transition: background-color 0.2s, border-color 0.2s, transform 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275), box-shadow 0.2s;
    }

    .mod-card:hover {
      background-color: var(--card-hover);
      border-color: var(--green);
      transform: scale(1.02) translateX(4px);
      box-shadow: 0 4px 20px rgba(0, 255, 102, 0.18);
    }

    .mod-info h3 {
      font-size: 0.98rem;
      font-weight: 600;
      margin-bottom: 3px;
      transition: color 0.2s;
    }

    .mod-card:hover .mod-info h3 {
      color: var(--green-light);
    }

    .mod-info p {
      font-size: 0.82rem;
      color: var(--muted);
    }

    .tag {
      font-size: 0.72rem;
      font-weight: 700;
      padding: 5px 9px;
      border-radius: 6px;
      background-color: rgba(0, 255, 102, 0.15);
