<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Keycraft • Mods Links</title>
  <style>
    :root {
      --bg: #040905;
      --card: rgba(10, 20, 12, 0.85);
      --card-hover: rgba(16, 32, 20, 0.95);
      --border: #1b3b20;
      --text: #f3f4f6;
      --muted: #9ca3af;
      
      --green: #00ff66;
      --green-light: #33ff88;
      --green-dark: #008833;
      --green-glow: rgba(0, 255, 102, 0.35);
      --green-glow-strong: rgba(0, 255, 102, 0.6);
    }

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
      padding: 36px 16px 48px;
      min-height: 100vh;
      position: relative;
      overflow-x: hidden;
    }

    /* Cenário de Mundo do Minecraft Fixo no Fundo */
    .mc-world-bg {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      background: linear-gradient(180deg, #030b06 0%, #071a0e 45%, #0c2b16 80%, #051208 100%);
      overflow: hidden;
    }

    .mc-stars {
      position: absolute;
      inset: 0;
      background-image: 
        radial-gradient(2px 2px at 15% 12%, rgba(255, 255, 255, 0.4), transparent),
        radial-gradient(2px 2px at 35% 25%, rgba(0, 255, 102, 0.5), transparent),
        radial-gradient(3px 3px at 65% 15%, rgba(255, 255, 255, 0.35), transparent),
        radial-gradient(2px 2px at 82% 28%, rgba(0, 255, 102, 0.4), transparent),
        radial-gradient(2px 2px at 50% 8%, rgba(255, 255, 255, 0.4), transparent),
        radial-gradient(2px 2px at 22% 40%, rgba(255, 255, 255, 0.25), transparent),
        radial-gradient(2px 2px at 78% 42%, rgba(0, 255, 102, 0.3), transparent);
    }

    .mc-clouds {
      position: absolute;
      top: 8%;
      left: 0;
      width: 200%;
      height: 120px;
      background-image: 
        linear-gradient(90deg, transparent 0%, transparent 10%, rgba(255,255,255,0.03) 10%, rgba(255,255,255,0.03) 25%, transparent 25%, transparent 55%, rgba(255,255,255,0.025) 55%, rgba(255,255,255,0.025) 75%, transparent 75%);
      animation: moveClouds 45s linear infinite;
    }

    @keyframes moveClouds {
      0% { transform: translateX(0); }
      100% { transform: translateX(-50%); }
    }

    .mc-terrain {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 220px;
      opacity: 0.45;
    }

    .container {
      width: 100%;
      max-width: 520px;
      position: relative;
      z-index: 1;
    }

    header {
      text-align: center;
      margin-bottom: 28px;
    }

    .avatar-container {
      width: 96px;
      height: 96px;
      margin: 0 auto 14px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--green), var(--green-dark));
      padding: 3px;
      box-shadow: 0 0 32px var(--green-glow);
      animation: pulseGlow 3s infinite alternate;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    @keyframes pulseGlow {
      0% { box-shadow: 0 0 20px rgba(0, 255, 102, 0.2); }
      100% { box-shadow: 0 0 38px var(--green-glow-strong); }
    }

    .avatar-inner {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      background-color: #081209;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .avatar-inner svg {
      width: 56px;
      height: 56px;
      filter: drop-shadow(0 4px 10px rgba(0, 255, 102, 0.35));
      animation: floatBlock 3s ease-in-out infinite;
    }

    @keyframes floatBlock {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-4px); }
    }

    header h1 {
      font-size: 1.8rem;
      font-weight: 800;
      margin-bottom: 4px;
      letter-spacing: -0.02em;
      background: linear-gradient(90deg, #fff, var(--green-light));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    header .handle {
      color: var(--green);
      font-size: 0.88rem;
      font-weight: 700;
      margin-bottom: 6px;
      text-shadow: 0 0 10px rgba(0, 255, 102, 0.4);
    }

    header p {
      color: var(--muted);
      font-size: 0.9rem;
    }

    .actions {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-bottom: 24px;
    }

    .social-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .btn-primary {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      text-decoration: none;
      padding: 15px 18px;
      border-radius: 12px;
      font-weight: 700;
      font-size: 0.96rem;
      backdrop-filter: blur(8px);
      transition: transform 0.2s ease, box-shadow 0.2s ease, background-color 0.2s ease, border-color 0.2s ease;
    }

    .btn-primary:hover {
      transform: translateY(-2px);
    }

    .btn-pix {
      background: linear-gradient(135deg, var(--green), var(--green-dark));
      color: #030a03;
      box-shadow: 0 4px 24px var(--green-glow);
      font-weight: 800;
    }

    .btn-pix:hover {
      background: linear-gradient(135deg, var(--green-light), var(--green));
      box-shadow: 0 6px 30px var(--green-glow-strong);
    }

    .btn-video {
      background-color: var(--card);
      color: var(--text);
      border: 1px solid var(--border);
    }

      border-color: var(--green);
      background-color: var
