<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Keycraft • Mods & Links</title>
  <style>
    :root {
      --bg: #030703;
      --card: #0a120a;
      --card-hover: #101c10;
      --border: #162e16;
      --text: #f3f4f6;
      --muted: #9ca3af;
      
      /* Cores Verdes Dinâmicas e Vibrantes */
      --green: #00ff66;
      --green-light: #33ff88;
      --green-dark: #008833;
      --green-glow: rgba(0, 255, 102, 0.35);
      --green-glow-strong: rgba(0, 255, 102, 0.6);
    }

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: var(--bg);
      background-image: 
        radial-gradient(circle at 50% -20%, rgba(0, 255, 102, 0.2) 0%, transparent 60%),
        radial-gradient(circle at 80% 90%, rgba(0, 136, 51, 0.1) 0%, transparent 50%);
      color: var(--text);
      display: flex;
      justify-content: center;
      padding: 36px 16px 48px;
      min-height: 100vh;
    }

    .container {
      width: 100%;
      max-width: 520px;
    }

    header {
      text-align: center;
      margin-bottom: 28px;
    }

    .avatar-container {
      width: 96px;
      height: 96px;
      margin: 0 auto 14px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--green), var(--green-dark));
      padding: 3px;
      box-shadow: 0 0 32px var(--green-glow);
      animation: pulseGlow 3s infinite alternate;
    }

    @keyframes pulseGlow {
      0% { box-shadow: 0 0 20px rgba(0, 255, 102, 0.2); }
      100% { box-shadow: 0 0 38px var(--green-glow-strong); }
    }

    .avatar {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      object-fit: cover;
      background-color: #0d140d;
    }

    header h1 {
      font-size: 1.8rem;
      font-weight: 800;
      margin-bottom: 4px;
      letter-spacing: -0.02em;
      background: linear-gradient(90deg, #fff, var(--green-light));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    header .handle {
      color: var(--green);
      font-size: 0.88rem;
      font-weight: 700;
      margin-bottom: 6px;
      text-shadow: 0 0 10px rgba(0, 255, 102, 0.4);
    }

    header p {
      color: var(--muted);
      font-size: 0.9rem;
    }

    .actions {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-bottom: 24px;
    }

    .btn-primary {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      text-decoration: none;
      padding: 15px 18px;
      border-radius
