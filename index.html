<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Keycraft • Mods & Links</title>
  <style>
    :root {
      --bg: #030704;
      --surface: rgba(10, 18, 12, 0.65);
      --surface-hover: rgba(16, 30, 20, 0.85);
      --border: rgba(0, 255, 102, 0.14);
      --border-hover: rgba(0, 255, 102, 0.55);
      --text: #f3f4f6;
      --muted: #8b9a90;
      --green: #00ff66;
      --green-soft: rgba(0, 255, 102, 0.12);
    }

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
      padding: 44px 16px 64px;
      min-height: 100vh;
      overflow-x: hidden;
      position: relative;
    }

    /* Fundo Minecraft Interativo (Canvas) */
    #mcCanvas {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
      pointer-events: none;
    }

    .container {
      width: 100%;
      max-width: 480px;
      position: relative;
      z-index: 1;
    }

    /* Cabeçalho Minimalista */
    header {
      text-align: center;
      margin-bottom: 32px;
    }

    .block-badge {
      width: 68px;
      height: 68px;
      margin: 0 auto 16px;
      border-radius: 18px;
      background: var(--surface);
      border: 1px solid var(--border);
      backdrop-filter: blur(12px);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
      transition: transform 0.3s cubic-bezier(0.22, 1, 0.36, 1), border-color 0.3s;
    }

    .block-badge:hover {
      transform: translateY(-3px) scale(1.04);
      border-color: var(--border-hover);
    }

    .block-badge svg {
      width: 38px;
      height: 38px;
    }

    header h1 {
      font-size: 1.65rem;
      font-weight: 700;
      letter-spacing: -0.03em;
      color: #ffffff;
      margin-bottom: 4px;
    }

    header .handle {
      color: var(--green);
      font-size: 0.85rem;
      font-weight: 600;
      letter-spacing: 0.02em;
      margin-bottom: 8px;
    }

    header p {
      color: var(--muted);
      font-size: 0.88rem;
      line-height: 1.4;
    }

    /* Botões Dinâmicos e Minimalistas */
    .actions {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 28px;
    }

    .btn {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: space-between;
      text-decoration: none;
      padding: 14px 18px;
      border-radius: 12px;
      font-size: 0.92rem;
      font-weight: 600;
      color: var(--text);
      background: var(--surface);
      border: 1px solid var(--border);
      backdrop-filter: blur(12px);
      transition: all 0.22s cubic-bezier(0.22, 1, 0.36, 1);
      overflow: hidden;
    }

    .btn-left {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .btn svg.icon {
      width: 18px;
      height: 18px;
      flex-shrink: 0;
      opacity: 0.9;
      transition: transform 0.22s ease, color 0.22s ease;
    }

    .btn .arrow {
      font-size: 0.85rem;
      color: var(--muted);
      transition: transform 0.22s ease, color 0.22s ease;
    }

    .btn:hover {
      background: var(--surface-hover);
      border-color: var(--border-hover);
      transform: translateY(-2px);
      box-shadow: 0 6px 24px rgba(0, 255, 102, 0.12);
    }

    .btn:hover svg.icon {
      color: var(--green);
      transform: scale(1.08);
    }
